[project]
name = "augur"
version = "0.1.0"
description = "Trading probability terminal — statistical analysis engine"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1",
  "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx2>=2.4",
]

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.format]
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
