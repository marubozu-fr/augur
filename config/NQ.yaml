# Augur — Instrument configuration
# This file is gitignored. Each user creates their own.

instrument: NQ
market_type: futures

# Timezone
source_timezone: America/Chicago
working_timezone: America/New_York

# Session definitions (all times in working_timezone)
sessions:
  rth:
    start: "09:30"
    end: "16:15"
  overnight:
    start: "18:00"  # previous day
    end: "09:30"
  eth:
    start: "18:00"  # previous day
    end: "16:15"

# Data paths
data:
  raw_csv: "data/raw/NQ_1min.csv"
  processed_dir: "data/processed"

# Available timeframes for candle building
timeframes:
  - 1min
  - 5min
  - 15min
  - 30min
  - 1h
  - daily
