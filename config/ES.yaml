# Augur — Instrument configuration
# Instrument sessions, timeframes and data paths.

instrument: ES
market_type: futures

# Timezone
# source_timezone, data.raw_csv and data.processed_dir describe the raw source data
# for the external preparation step and are not read by the stats engine, which
# expects 1-min Parquet data already in working_timezone.
source_timezone: America/Chicago
working_timezone: America/New_York

# Session definitions (all times in working_timezone)
sessions:
  rth:
    start: "09:30"
    end: "16:15"
  overnight:
    start: "18:00"  # previous day
    end: "09:30"
  eth:
    start: "18:00"  # previous day
    end: "16:15"
  # Geographic trading sessions, carved from the 24h cycle on the 09:30 RTH
  # boundary so they never overlap (the only gap, 16:15–18:00, is the CME break
  # with no NQ trading). Used by the market_session_breakout stat.
  asia:
    start: "18:00"  # previous day
    end: "03:00"
  london:
    start: "03:00"
    end: "09:30"
  ny:
    start: "09:30"
    end: "16:15"

# Data paths
data:
  raw_csv: "data/raw/ES_1min.csv"
  processed_dir: "data/processed"

# Available timeframes for candle building
timeframes:
  - 1min
  - 5min
  - 15min
  - 30min
  - 1h
  - daily
