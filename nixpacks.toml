[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "pip install uv",
  "uv sync --frozen",
  "npm install -g pnpm",
  "cd frontend && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = ["cd frontend && pnpm build"]

[start]
cmd = "uv run uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}"